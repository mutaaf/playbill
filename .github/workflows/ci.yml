name: ci
on:
  push:
  pull_request:
  # Daily: fail (and email the owner) if Cast List has moved on and Playbill hasn't followed.
  schedule: [{ cron: '17 7 * * *' }]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run check
      - name: Routes and bindings match Cast List
        run: node scripts/sync.mjs --check
